# Rental-IQ / FleetVision — Phase 2+ stack (API + TimescaleDB + Redis + Kafka + telemetry consumer)
# Frontend: cd frontend && npm run dev
# Dataset: ./cat_smart_rental_dataset mounted at /dataset (SEED_RENTAL=true)
#
# First-time Timescale switch may require: docker compose down -v

services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: fleetvision-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fleetvision}
      POSTGRES_USER: ${POSTGRES_USER:-fleetvision}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fleetvision}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # New volume name for Timescale (vanilla Postgres data is incompatible)
      - fleetvision_tsdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fleetvision} -d ${POSTGRES_DB:-fleetvision}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fleetvision-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - fleetvision_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.8.1
    container_name: fleetvision-kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fleetvision-api
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - ./backend/.env.docker
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-fleetvision}:${POSTGRES_PASSWORD:-fleetvision}@db:5432/${POSTGRES_DB:-fleetvision}
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/1}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_TELEMETRY_TOPIC: ${KAFKA_TELEMETRY_TOPIC:-fleet.telemetry}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./cat_smart_rental_dataset:/dataset:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/system/health/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 50s

  telemetry-consumer:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fleetvision-telemetry-consumer
    restart: unless-stopped
    env_file:
      - ./backend/.env.docker
    environment:
      ROLE: consumer
      DATABASE_URL: postgres://${POSTGRES_USER:-fleetvision}:${POSTGRES_PASSWORD:-fleetvision}@db:5432/${POSTGRES_DB:-fleetvision}
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/1}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_TELEMETRY_TOPIC: ${KAFKA_TELEMETRY_TOPIC:-fleet.telemetry}
      SEED_DEMO: "false"
      SEED_RENTAL: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./cat_smart_rental_dataset:/dataset:ro

volumes:
  fleetvision_tsdata:
  fleetvision_redis:
